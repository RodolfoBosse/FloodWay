        <h2>Sobre o FloodWay & Prevenção no Vale do Taquari</h2>
        <p>O <strong>FloodWay</strong> é um portal e ferramenta de utilidade pública desenvolvido para a população da Bacia Hidrográfica do Rio Taquari-Antas. O sistema monitora as medições dos sensores fluviométricos do Serviço Geológico do Brasil (SGB/CPRM) e Agência Nacional de Águas (ANA), correlacionando as cotas do rio com o modelo digital de elevação (DEM) e altimetria de cada logradouro de Lajeado e cidades vizinhas.</p>
        
        <h2>Tabela de Cotas Oficiais de Inundação</h2>
        <ul>
          <li><strong>13,00m a 17,00m:</strong> Nível Normal / Estável (sem riscos urbanos)</li>
          <li><strong>17,00m:</strong> Cota de Atenção (Defesa Civil aciona estado de prontidão)</li>
          <li><strong>19,00m:</strong> Cota de Alerta (famílias em áreas baixas devem preparar desocupação)</li>
          <li><strong>19,80m:</strong> Início do alagamento de vias públicas (Rua Décio Martins Costa e Parque Piraí)</li>
          <li><strong>29,80m+:</strong> Maior enchente da história registrada (Maio de 2024)</li>
        </ul>

        <h2>Como Funcionam as Rotas Seguras Anti-Enchente</h2>
        <p>Durante a elevação do rio, as vias que atingem sua cota de alagamento são desativadas dinamicamente na malha viária, calculando trajetos de desvio exclusivamente por colinas e pontos altos não inundáveis.</p>
